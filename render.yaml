services:
  # ── BACKEND (FastAPI) ──────────────────────────────────
  - type: web
    name: politech-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        value: politech_super_secret_key_2024
      - key: DATABASE_URL
        value: sqlite:///./politech.db
      - key: ALLOWED_ORIGINS
        value: https://politech-frontend.onrender.com,http://localhost:5500

  # ── FRONTEND (Static HTML/JS/CSS) ─────────────────────
  - type: web
    name: politech-frontend
    env: static
    buildCommand: echo "No build step needed"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /login.html
